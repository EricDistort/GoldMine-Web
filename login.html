<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Login | Quantum Core</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- FOUNDRY CORE DESIGN SYSTEM --- */
      :root {
        --bg-top: #000000;
        --bg-mid: #05000a;
        --bg-bottom: #0a0014;

        --theme-primary: #ff00aa;
        --theme-secondary: #9000ff;

        --glass-border: rgba(255, 0, 170, 0.15);
        --text-grey: #8b8b8b;

        --radius-app: 25px;
      }

      /* --- GLOBAL RESET --- */
      * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }

      body {
        background: linear-gradient(
          180deg,
          var(--bg-top) 0%,
          var(--bg-mid) 50%,
          var(--bg-bottom) 100%
        );
        background-attachment: fixed;
        color: #fff;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      /* --- BACKGROUND FX --- */
      .glow-top {
        position: absolute;
        top: -20vh;
        left: -20vw;
        width: 140vw;
        height: 140vw;
        background: radial-gradient(
          circle,
          rgba(255, 0, 170, 0.15) 0%,
          transparent 60%
        );
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        animation: pulseGlow 10s infinite alternate;
      }

      @keyframes pulseGlow {
        0% {
          opacity: 0.5;
          transform: scale(1);
        }
        100% {
          opacity: 0.8;
          transform: scale(1.1);
        }
      }

      /* --- LAYOUT --- */
      .container {
        position: relative;
        z-index: 10;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 30px;
        max-width: 500px;
        width: 100%;
        margin: 0 auto;
      }

      /* --- TYPOGRAPHY --- */
      .header {
        margin-bottom: 50px;
      }

      .title-outline {
        font-size: 42px;
        font-weight: 800;
        color: transparent;
        -webkit-text-stroke: 1px var(--theme-primary);
        letter-spacing: 2px;
        margin: 0;
        line-height: 1;
        text-transform: uppercase;
        opacity: 0.8;
      }

      .title-filled {
        font-size: 56px;
        font-weight: 900;
        color: #fff;
        letter-spacing: 2px;
        margin: 0;
        line-height: 1.1;
        text-transform: uppercase;
        text-shadow: 0 0 30px rgba(255, 0, 170, 0.3);
      }

      .subtitle {
        font-size: 14px;
        color: var(--text-grey);
        margin-top: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      /* --- FORMS --- */
      .input-group {
        margin-bottom: 25px;
        position: relative;
        z-index: 20;
      }

      .label {
        font-size: 10px;
        font-weight: 800;
        color: var(--theme-primary);
        margin-bottom: 8px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: block;
        opacity: 0.8;
      }

      .input-field {
        position: relative;
        z-index: 30;
        width: 100%;
        background-color: #050505;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 18px 20px;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
      }

      .input-field:focus {
        border-color: var(--theme-secondary);
        background-color: #000;
        box-shadow: 0 0 15px rgba(144, 0, 255, 0.15);
      }

      .input-field::placeholder {
        color: #444;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .spacer {
        height: 15px;
      }

      /* --- BUTTONS --- */
      .pop-btn {
        position: relative;
        z-index: 20;
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
        user-select: none;
        border: none;
        background: none;
        padding: 0;
        width: 100%;
      }

      .pop-btn:active {
        transform: scale(0.96);
      }

      .gradient-btn {
        width: 100%;
        padding: 20px;
        border-radius: 25px;
        background: linear-gradient(
          90deg,
          var(--theme-primary),
          var(--theme-secondary)
        );
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 30px rgba(255, 0, 170, 0.2);
        margin-top: 10px;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .pop-btn:hover .gradient-btn {
        background: linear-gradient(
          90deg,
          var(--theme-secondary),
          var(--theme-primary)
        );
        box-shadow: 0 0 30px rgba(144, 0, 255, 0.4);
        transform: translateY(-2px);
      }

      .btn-text {
        color: #fff;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* --- LINKS --- */
      .register-link {
        text-align: center;
        margin-top: 30px;
        display: block;
        text-decoration: none;
        transition: 0.3s;
      }
      .register-link:hover {
        transform: translateY(-2px);
      }

      .register-text {
        color: var(--text-grey);
        font-size: 13px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .register-highlight {
        color: var(--theme-secondary);
        font-weight: 800;
        margin-left: 5px;
        text-shadow: 0 0 10px rgba(144, 0, 255, 0.2);
      }

      /* --- LOADING OVERLAY --- */
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        backdrop-filter: blur(10px);
        z-index: 999;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        animation: fadeIn 0.3s ease;
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 0, 170, 0.2);
        border-radius: 50%;
        border-top-color: var(--theme-primary);
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 20px rgba(255, 0, 170, 0.1);
      }

      .loading-text {
        margin-top: 20px;
        color: var(--theme-primary);
        font-family: "JetBrains Mono";
        font-size: 12px;
        letter-spacing: 2px;
        animation: pulse 1.5s infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* --- RESPONSIVE DESIGN --- */
      /* Tablet & Small Devices (480px - 768px) */
      @media (max-width: 768px) {
        .container {
          padding: 25px;
          max-width: 100%;
        }

        .glow-top {
          top: -30vh;
          left: -30vw;
          width: 160vw;
          height: 160vw;
        }

        .title-outline {
          font-size: 32px;
          letter-spacing: 1px;
        }

        .title-filled {
          font-size: 44px;
          letter-spacing: 1px;
        }

        .subtitle {
          font-size: 12px;
        }

        .label {
          font-size: 9px;
          letter-spacing: 1px;
        }

        .input-field {
          padding: 16px 18px;
          font-size: 15px;
          border-radius: 18px;
        }

        .btn-text {
          font-size: 14px;
          letter-spacing: 1.5px;
        }

        .gradient-btn {
          padding: 18px;
          border-radius: 22px;
        }

        .register-text {
          font-size: 12px;
        }

        .spinner {
          width: 50px;
          height: 50px;
          border-width: 3px;
        }

        .loading-text {
          font-size: 11px;
        }
      }

      /* Mobile Small (under 480px) */
      @media (max-width: 480px) {
        body {
          padding: 0;
        }

        .container {
          padding: 20px;
          max-width: 100%;
          justify-content: flex-start;
          padding-top: 60px;
        }

        .glow-top {
          top: -50vh;
          left: -40vw;
          width: 180vw;
          height: 180vw;
          opacity: 0.3;
        }

        .header {
          margin-bottom: 35px;
        }

        .title-outline {
          font-size: 24px;
          -webkit-text-stroke: 0.5px var(--theme-primary);
          letter-spacing: 0.5px;
        }

        .title-filled {
          font-size: 32px;
          letter-spacing: 0.5px;
          text-shadow: 0 0 20px rgba(255, 0, 170, 0.2);
        }

        .subtitle {
          font-size: 11px;
          letter-spacing: 0.5px;
          margin-top: 8px;
        }

        .input-group {
          margin-bottom: 20px;
        }

        .label {
          font-size: 8px;
          letter-spacing: 0.5px;
          margin-bottom: 6px;
        }

        .input-field {
          padding: 14px 16px;
          font-size: 14px;
          border-radius: 16px;
          height: 48px;
          display: flex;
          align-items: center;
        }

        .input-field::placeholder {
          font-size: 11px;
        }

        .spacer {
          height: 10px;
        }

        .gradient-btn {
          padding: 16px;
          border-radius: 20px;
          min-height: 48px;
        }

        .btn-text {
          font-size: 13px;
          letter-spacing: 1px;
        }

        .register-link {
          margin-top: 20px;
        }

        .register-text {
          font-size: 11px;
          letter-spacing: 0.5px;
        }

        .spinner {
          width: 45px;
          height: 45px;
          border-width: 3px;
        }

        .loading-text {
          font-size: 10px;
          letter-spacing: 1.5px;
        }

        #loading-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          overflow: hidden;
        }
      }

      /* Large Desktop (1200px+) */
      @media (min-width: 1200px) {
        .container {
          padding: 40px;
          max-width: 550px;
        }

        .header {
          margin-bottom: 60px;
        }

        .title-outline {
          font-size: 48px;
        }

        .title-filled {
          font-size: 64px;
        }

        .input-group {
          margin-bottom: 28px;
        }

        .input-field {
          padding: 20px 24px;
          font-size: 16px;
        }

        .gradient-btn {
          padding: 22px;
        }
      }

      /* Landscape orientation adjustments */
      @media (max-height: 600px) and (orientation: landscape) {
        .container {
          padding-top: 20px;
          padding-bottom: 20px;
          justify-content: center;
        }

        .header {
          margin-bottom: 20px;
        }

        .title-outline {
          font-size: 28px;
        }

        .title-filled {
          font-size: 36px;
        }

        .input-group {
          margin-bottom: 15px;
        }

        .spacer {
          height: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow-top"></div>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">AUTHENTICATING...</div>
    </div>

    <div class="container">
      <div class="header">
        <h1 class="title-outline">Welcome</h1>
        <h1 class="title-filled">Back</h1>
        <p class="subtitle">Sign in to access your portfolio.</p>
      </div>

      <div class="input-group">
        <label class="label">ACCOUNT NUMBER</label>
        <input
          type="tel"
          id="accountNumber"
          class="input-field"
          placeholder="E.G. 12345678"
        />
      </div>

      <div class="input-group">
        <label class="label">PASSWORD</label>
        <input
          type="password"
          id="password"
          class="input-field"
          placeholder="••••••••••••"
        />
      </div>

      <div class="spacer"></div>

      <button id="loginBtn" class="pop-btn">
        <div class="gradient-btn">
          <span class="btn-text">ACCESS ACCOUNT</span>
        </div>
      </button>

      <a href="register.html" class="pop-btn register-link">
        <span class="register-text"
          >New here?
          <span class="register-highlight">Create Account</span></span
        >
      </a>
    </div>

    <script type="module">
      import { supabase } from "./supabaseClient.js";
      import { UserContext } from "./UserContext.js";

      const loginBtn = document.getElementById("loginBtn");
      const loadingOverlay = document.getElementById("loading-overlay");
      const accountInput = document.getElementById("accountNumber");
      const passwordInput = document.getElementById("password");

      loginBtn.addEventListener("click", async (e) => {
        e.preventDefault();

        const accNum = accountInput.value.trim();
        const pass = passwordInput.value.trim();

        if (!accNum || !pass) {
          alert("CREDENTIALS REQUIRED");
          return;
        }

        loadingOverlay.style.display = "flex";
        const startTime = Date.now();

        try {
          const { data: user, error } = await supabase
            .from("users")
            .select("*")
            .eq("account_number", parseInt(accNum))
            .maybeSingle();

          if (error) throw error;

          const elapsedTime = Date.now() - startTime;
          const minDuration = 1500;
          const remainingTime = Math.max(0, minDuration - elapsedTime);
          await new Promise((r) => setTimeout(r, remainingTime));

          if (!user) {
            throw new Error("ACCOUNT NOT FOUND");
          }

          if (user.password === pass) {
            UserContext.setUser(user);
            window.location.href = "main.html";
          } else {
            throw new Error("INVALID PASSWORD");
          }
        } catch (err) {
          await new Promise((r) => setTimeout(r, 1000));
          alert(err.message);
        } finally {
          loadingOverlay.style.display = "none";
        }
      });
    </script>
  </body>
</html>
