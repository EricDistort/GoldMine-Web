<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Live Support | Quantum Core</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- FOUNDRY CORE DESIGN SYSTEM --- */
      :root {
        --bg-top: #000000;
        --bg-mid: #0a000e;
        --bg-bottom: #170020;

        --theme-primary: #ff00aa;
        --theme-secondary: #9000ff;

        --status-active: #00ffaa;
        --status-polling: #ffaa00;

        --glass-border: rgba(255, 0, 170, 0.15);
      }

      /* --- GLOBAL RESET --- */
      * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
        -webkit-tap-highlight-color: transparent;
        outline: none;
      }

      body {
        background: linear-gradient(
          180deg,
          var(--bg-top) 0%,
          var(--bg-mid) 50%,
          var(--bg-bottom) 100%
        );
        background-attachment: fixed;
        color: #fff;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- GLOBAL INTERACTION PHYSICS --- */
      .pop-click {
        transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        cursor: pointer;
        will-change: transform;
      }
      .pop-click:active {
        transform: scale(0.9);
      }
      .pop-click:disabled {
        opacity: 0.5;
        pointer-events: none;
        transform: none;
      }

      /* --- HEADER --- */
      .header-container {
        padding-top: 20px;
        padding-bottom: 10px;
        background: transparent;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }

      .back-btn {
        position: absolute;
        left: 20px;
        top: 25px;
        color: var(--theme-primary);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        background: rgba(255, 0, 170, 0.05);
        border: 1px solid rgba(255, 0, 170, 0.2);
      }

      .header-line {
        height: 2px;
        width: 30%;
        background: linear-gradient(
          90deg,
          var(--theme-primary),
          var(--theme-secondary)
        );
        border-radius: 2px;
        margin-bottom: 10px;
        opacity: 0.7;
      }

      .header-content {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .header-title {
        font-size: 20px;
        font-weight: 900;
        color: var(--theme-primary);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin: 0;
        display: flex;
        align-items: center;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-left: 8px;
        background-color: var(--status-polling);
        box-shadow: 0 0 8px currentColor;
        transition: background-color 0.3s ease;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 0, 170, 0.2);
        border-top: 2px solid var(--theme-primary);
        border-radius: 50%;
        animation: spin 1s infinite linear;
        margin-left: 10px;
        display: none;
      }

      /* --- CHAT AREA --- */
      .list-container {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        padding-bottom: 20px;
        display: flex;
        flex-direction: column;
        scroll-behavior: smooth;
      }

      .list-container::-webkit-scrollbar {
        width: 4px;
      }
      .list-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .list-container::-webkit-scrollbar-thumb {
        background: rgba(255, 0, 170, 0.3);
        border-radius: 2px;
      }

      .empty-container {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 50px;
        opacity: 0.5;
      }

      .empty-text {
        color: var(--theme-primary);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        font-family: "JetBrains Mono", monospace;
      }

      /* --- BUBBLES --- */
      .message-bubble {
        padding: 12px;
        border-radius: 16px;
        margin-bottom: 8px;
        max-width: 80%;
        animation: slideUp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .user-bubble {
        background-color: #330022;
        align-self: flex-end;
        border-bottom-right-radius: 2px;
        border: 1px solid var(--theme-primary);
      }

      .admin-bubble {
        background-color: #1a1a1a;
        align-self: flex-start;
        border-bottom-left-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .message-text {
        font-size: 14px;
        color: #fff;
        line-height: 1.4;
      }

      .admin-text {
        color: #ccc;
      }

      /* --- INPUT AREA --- */
      .input-wrapper {
        padding: 15px;
        background: transparent;
        flex-shrink: 0;
      }

      .input-row {
        display: flex;
        align-items: center;
      }

      .input-field {
        flex: 1;
        background-color: #121212;
        border-radius: 25px;
        padding: 12px 15px;
        margin-right: 10px;
        color: #fff;
        border: 1px solid rgba(255, 0, 170, 0.2);
        font-size: 14px;
        transition: border-color 0.3s;
      }

      .input-field:focus {
        border-color: var(--theme-primary);
      }

      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .send-button {
        width: 45px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 25px;
        background: linear-gradient(
          135deg,
          var(--theme-primary),
          var(--theme-secondary)
        );
        border: none;
        box-shadow: 0 2px 10px rgba(255, 0, 170, 0.3);
      }

      .send-button-text {
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 2px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="header-container">
      <a href="main.html" class="back-btn pop-click">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </a>
      <div class="header-line"></div>
      <div class="header-content">
        <h1 class="header-title">LIVE SUPPORT</h1>
        <div id="loadingSpinner" class="spinner"></div>
        <div id="statusDot" class="status-dot"></div>
      </div>
    </div>

    <div id="chatContainer" class="list-container"></div>

    <div class="input-wrapper">
      <div class="input-row">
        <input
          type="text"
          id="messageInput"
          class="input-field"
          placeholder="Transmitting message..."
          autocomplete="off"
        />
        <button id="sendBtn" class="send-button pop-click" disabled>
          <span class="send-button-text">➤</span>
        </button>
      </div>
    </div>

    <script type="module">
      import { supabase } from "./supabaseClient.js";
      import { UserContext } from "./UserContext.js";

      const els = {
        chatContainer: document.getElementById("chatContainer"),
        messageInput: document.getElementById("messageInput"),
        sendBtn: document.getElementById("sendBtn"),
        loadingSpinner: document.getElementById("loadingSpinner"),
        statusDot: document.getElementById("statusDot"),
      };

      let currentUser = null;
      let conversationId = null;
      let messages = [];
      let isSocketActive = false;
      let pollingInterval = null;
      let isLoading = true;

      async function init() {
        currentUser = UserContext.getUser();
        if (!currentUser) {
          window.location.href = "index.html";
          return;
        }

        setLoading(true);

        try {
          const { data: existingConv, error: fetchError } = await supabase
            .from("conversations")
            .select("id")
            .eq("user_id", currentUser.id)
            .eq("status", "open")
            .maybeSingle();

          if (fetchError) throw fetchError;

          if (existingConv) {
            conversationId = existingConv.id;
          } else {
            const { data: newConv, error: createError } = await supabase
              .from("conversations")
              .insert([{ user_id: currentUser.id }])
              .select()
              .single();
            if (createError) throw createError;
            conversationId = newConv.id;
          }

          if (conversationId) {
            await fetchMessages(conversationId);
            setupRealtime();
            setupPollingFallback();
          }
        } catch (error) {
          console.error("Chat Init Error:", error.message);
        } finally {
          setLoading(false);
        }
      }

      async function fetchMessages(convId) {
        try {
          const { data, error } = await supabase
            .from("messages")
            .select("*")
            .eq("conversation_id", convId)
            .order("created_at", { ascending: true });

          if (!error && data) {
            // Only update DOM if there's a change in count
            if (data.length !== messages.length) {
              messages = data;
              renderMessages();
            }
          }
        } catch (err) {
          console.log("Fetch error:", err);
        }
      }

      function setupRealtime() {
        if (!conversationId) return;

        const channelName = `chat_room_${conversationId}`;
        const channel = supabase
          .channel(channelName)
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "messages" },
            (payload) => {
              if (
                String(payload.new.conversation_id) === String(conversationId)
              ) {
                const exists = messages.some(
                  (m) => String(m.id) === String(payload.new.id),
                );
                if (!exists) {
                  messages.push(payload.new);
                  renderMessages();
                }
              }
            },
          )
          .subscribe((status) => {
            isSocketActive = status === "SUBSCRIBED";
            updateStatusUI();
          });

        // Cleanup on window unload
        window.addEventListener("beforeunload", () => {
          supabase.removeChannel(channel);
        });
      }

      function setupPollingFallback() {
        if (pollingInterval) clearInterval(pollingInterval);

        pollingInterval = setInterval(() => {
          if (!isSocketActive && conversationId) {
            fetchMessages(conversationId);
          }
        }, 4000);
      }

      async function sendMessage() {
        const text = els.messageInput.value.trim();
        if (!text || !conversationId) return;

        els.messageInput.value = "";
        toggleButton();

        try {
          const { data, error } = await supabase
            .from("messages")
            .insert([
              {
                conversation_id: conversationId,
                sender_id: currentUser.id,
                sender_type: "user",
                message_text: text,
              },
            ])
            .select()
            .single();

          if (error) throw error;

          if (data) {
            const exists = messages.some(
              (m) => String(m.id) === String(data.id),
            );
            if (!exists) {
              messages.push(data);
              renderMessages();
            }
          }
        } catch (error) {
          alert("TRANSMISSION FAILED");
          els.messageInput.value = text;
          toggleButton();
        }
      }

      function renderMessages() {
        if (messages.length === 0) {
          if (!isLoading) {
            els.chatContainer.innerHTML = `
              <div class="empty-container">
                <span class="empty-text">SECURE LINE ACTIVE</span>
              </div>
            `;
          }
          return;
        }

        els.chatContainer.innerHTML = messages
          .map((msg) => {
            const isUser = msg.sender_type === "user";
            const bubbleClass = isUser ? "user-bubble" : "admin-bubble";
            const textClass = isUser ? "" : "admin-text";

            return `
              <div class="message-bubble ${bubbleClass}">
                <span class="message-text ${textClass}">${escapeHtml(msg.message_text)}</span>
              </div>
            `;
          })
          .join("");

        scrollToBottom();
      }

      function setLoading(state) {
        isLoading = state;
        els.loadingSpinner.style.display = state ? "inline-block" : "none";
        if (state && messages.length === 0) {
          els.chatContainer.innerHTML = "";
        }
      }

      function updateStatusUI() {
        els.statusDot.style.backgroundColor = isSocketActive
          ? "var(--status-active)"
          : "var(--status-polling)";
        els.statusDot.style.boxShadow = `0 0 8px ${isSocketActive ? "var(--status-active)" : "var(--status-polling)"}`;
      }

      function scrollToBottom() {
        setTimeout(() => {
          els.chatContainer.scrollTop = els.chatContainer.scrollHeight;
        }, 100);
      }

      function escapeHtml(text) {
        if (!text) return "";
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function toggleButton() {
        els.sendBtn.disabled = !els.messageInput.value.trim();
      }

      // Event Listeners
      els.sendBtn.addEventListener("click", sendMessage);
      els.messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") sendMessage();
      });
      els.messageInput.addEventListener("input", toggleButton);

      // Handle virtual keyboard on mobile web
      els.messageInput.addEventListener("focus", () => {
        setTimeout(scrollToBottom, 300);
      });

      // Page visibility recovery (AppState fallback)
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && conversationId) {
          fetchMessages(conversationId);
        }
      });

      // Initialize App
      init();
    </script>
  </body>
</html>
